<!-- templates/omk/feedback_thanks.html -->
{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-gradient-to-b from-blue-50 to-white py-16 min-h-screen" data-aos="fade-up">
  <div class="container mx-auto px-4 max-w-2xl text-center">
    <div class="bg-white rounded-3xl shadow-lg p-8 md:p-12" data-aos="zoom-in">
      <div class="mb-8 animate__animated animate__bounceIn">
        <div class="text-6xl mb-4 text-[#60B0E5]">✓</div>
        <h1 class="text-3xl font-bold text-[#372B82] mb-4 animate__animated animate__fadeInDown">
          Terima kasih atas Feedback Anda!
        </h1>
        <p class="text-gray-600 animate__animated animate__fadeInUp">
          Kami akan segera meninjau masukan berharga dari Anda
        </p>
      </div>
      <a href="{% url 'omk:home' %}" 
         class="inline-block bg-[#60B0E5] text-white px-6 py-3 rounded-lg hover:bg-[#372B82] transition-colors animate__animated animate__fadeInUp animate__delay-1s"
         data-aos="flip-up">
        Kembali ke Beranda
      </a>
    </div>
  </div>
  
  <!-- Decorative elements -->
  <div class="absolute top-0 right-0 w-64 h-64 bg-[#60B0E5] opacity-5 rounded-full -translate-x-16 -translate-y-24"></div>
  <div class="absolute bottom-0 left-0 w-80 h-80 bg-[#372B82] opacity-5 rounded-full translate-x-8 translate-y-32"></div>
</section>
{% endblock %}
