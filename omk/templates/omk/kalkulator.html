{% extends 'base.html' %}
{% load static %}

{% block content %}
<section class="bg-gradient-to-b from-[#E8F4FC] to-white py-16 min-h-screen" data-aos="fade-up">
  <div class="container mx-auto px-4 max-w-2xl">
    <!-- Decorative elements -->
    <div class="absolute top-0 right-0 w-64 h-64 bg-[#60B0E5] opacity-5 rounded-full -translate-x-16 -translate-y-24"></div>
    <div class="absolute bottom-0 left-0 w-80 h-80 bg-[#372B82] opacity-5 rounded-full translate-x-8 translate-y-32"></div>
    
    <div class="bg-white rounded-3xl shadow-lg p-8 md:p-12" data-aos="zoom-in">
      <h1 class="text-3xl font-bold text-[#372B82] mb-8 text-center animate__animated animate__fadeInDown" 
          data-aos="fade-down">
        Kalkulator Ongkos CampusRide
      </h1>
      
      <div class="mb-8" data-aos="fade-right" data-aos-delay="200">
        <label class="block text-gray-700 text-lg mb-4 font-medium animate__animated animate__fadeInLeft">
          Masukkan Jarak (km)
        </label>
        <input type="number" id="kmInput" 
               class="w-full p-4 border-2 border-[#60B0E5] rounded-lg focus:border-[#372B82] focus:ring-2 focus:ring-[#60B0E5] outline-none transition-all animate__animated animate__fadeInUp"
               step="0.1" min="0" placeholder="Contoh: 5.5">
        <p class="text-red-500 mt-2 text-sm" id="errorMessage"></p>
      </div>

      <button onclick="calculate()" 
              class="w-full bg-gradient-to-r from-[#60B0E5] to-[#372B82] text-white py-4 px-8 rounded-lg font-bold hover:from-[#4A90D6] hover:to-[#2E2368] transition-all shadow-lg hover:shadow-xl animate__animated animate__fadeInUp animate__delay-1s"
              data-aos="flip-up">
        Hitung Ongkos
      </button>

      <div id="result" class="mt-12 hidden" data-aos="flip-left">
        <div class="bg-[#E8F4FC] rounded-xl p-6 animate__animated animate__fadeIn">
          <h3 class="text-xl font-semibold text-[#372B82] mb-4">Hasil Perhitungan</h3>
          <div class="space-y-4">
            <p class="text-gray-700 animate__animated animate__fadeInLeft">
              Untuk jarak <span id="resultKm" class="font-bold text-[#60B0E5]"></span> km:
            </p>
            <p class="text-2xl font-bold text-[#60B0E5] animate__animated animate__fadeInRight">
              <span id="resultCost"></span>
            </p>
            <div class="text-sm text-gray-500 mt-2" data-aos="fade-up">
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
function calculate() {
  const kmInput = document.getElementById('kmInput');
  const errorMessage = document.getElementById('errorMessage');
  const resultDiv = document.getElementById('result');
  const resultKm = document.getElementById('resultKm');
  const resultCost = document.getElementById('resultCost');
  
  resultDiv.classList.add('hidden');
  errorMessage.textContent = '';

  fetch(`/api/calculate-cost/?km=${kmInput.value}`)
    .then(response => response.json())
    .then(data => {
      if(data.valid) {
        resultKm.textContent = data.km.toFixed(1);
        resultCost.textContent = data.formatted_cost;
        resultDiv.classList.remove('hidden');
        // Trigger animation when showing result
        resultDiv.classList.add('animate__fadeInUp');
      } else {
        errorMessage.textContent = data.error;
      }
    })
    .catch(error => {
      errorMessage.textContent = 'Terjadi kesalahan, silakan coba lagi';
    });
}
</script>
{% endblock %}
